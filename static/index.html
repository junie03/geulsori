<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>자막 통화</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --brand: #4f46e5; --brand-2: #7c3aed; --brand-soft: #eef2ff; --brand-text: #4338ca;
  --bg: #f4f5f9; --surface: #ffffff; --surface-2: #eff1f6; --text: #111318; --sub: #6b7280; --line: #e5e7ee;
  --outer: #e6e8f0;
  --peer: #ffffff; --peer-text: #111318; --me: #4f46e5; --me-text: #ffffff;
  --danger: #ef4444; --ok: #22c55e; --mark: #fde68a; --mark-text: #111318;
  --shadow: 0 1px 2px rgba(17, 19, 24, .04), 0 6px 20px rgba(17, 19, 24, .06);
  --fs: 18px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand: #6366f1; --brand-soft: #1e1b4b; --brand-text: #c7d2fe;
    --bg: #0b0d12; --surface: #151821; --surface-2: #1f2330; --text: #eef0f5; --sub: #9aa3b2; --line: #262b37;
    --outer: #050609;
    --peer: #1f2330; --peer-text: #eef0f5; --me: #5b5bf0;
    --mark: #facc15; --shadow: 0 0 0 1px var(--line);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.5 "Pretendard Variable", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { opacity: .5; cursor: default; }
.ic { width: 22px; height: 22px; flex-shrink: 0; }
.hidden { display: none !important; }
.grow { flex: 1; min-width: 0; }
.sub { color: var(--sub); font-size: 14px; }
.row { display: flex; gap: 10px; align-items: center; }
.spacer { flex: 1; }

/* 앱 틀: 넓은 화면에서는 휴대폰 폭으로 가운데 */
.app { max-width: 440px; margin: 0 auto; min-height: 100dvh; background: var(--bg); position: relative; }
@media (min-width: 560px) {
  body { background: var(--outer); }
  .app { box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0, 0, 0, .12); }
}
.screen { display: none; min-height: 100dvh; padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); flex-direction: column; gap: 16px; }
.screen.on { display: flex; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }

/* 공통 요소 */
.btn { border-radius: 16px; padding: 15px 18px; font-weight: 600; background: var(--surface-2); transition: transform .1s, filter .2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: var(--brand); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.block { width: 100%; }
.btn.sm { padding: 10px 14px; border-radius: 12px; font-size: 14px; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-2); transition: transform .1s; }
.icon-btn:active { transform: scale(.94); }
.round { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; color: #fff; transition: transform .1s; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); }
.round:active { transform: scale(.94); }
.round .ic { width: 30px; height: 30px; }
.round.danger { background: var(--danger); }
.round.ok { background: var(--ok); }
.round.sm { width: 44px; height: 44px; box-shadow: none; }
.round.sm .ic { width: 20px; height: 20px; }
.hangup .ic { transform: rotate(135deg); }
input, textarea { width: 100%; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; }
input:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 18%, transparent); }
textarea { resize: none; }
.card { background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; }
.label { font-size: 14px; font-weight: 600; color: var(--sub); }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .4px; padding: 3px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-text); }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; font-weight: 700; font-size: 18px; color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); }
.avatar.xl { width: 112px; height: 112px; font-size: 44px; background: rgba(255, 255, 255, .18); border: 2px solid rgba(255, 255, 255, .35); }
mark { background: var(--mark); color: var(--mark-text); border-radius: 5px; padding: 0 3px; }

/* 1. 설정 */
.hero { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin: 28px 0 12px; }
.logo { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 10px 30px color-mix(in srgb, var(--brand) 40%, transparent); margin-bottom: 12px; }
.logo .ic { width: 32px; height: 32px; }
.hero h1 { font-size: 28px; margin: 0; letter-spacing: -.5px; }
.hero p { margin: 0; color: var(--sub); }
.field { display: flex; flex-direction: column; gap: 8px; }
.modes { display: flex; flex-direction: column; gap: 10px; }
.mode { display: flex; gap: 14px; align-items: center; text-align: left; padding: 16px; border-radius: 20px; background: var(--surface); border: 2px solid var(--line); transition: border-color .15s, background .15s; }
.mode b { display: block; font-size: 16px; margin-bottom: 2px; }
.mode .sub { display: block; line-height: 1.4; }
.mode-ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-2); color: var(--brand); flex-shrink: 0; transition: background .15s, color .15s; }
.mode .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; position: relative; }
.mode.sel { border-color: var(--brand); background: var(--brand-soft); }
.mode.sel .mode-ic { background: var(--brand); color: #fff; }
.mode.sel .check { border-color: var(--brand); background: var(--brand); }
.mode.sel .check::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }

/* 2. 홈 */
.topbar { display: flex; align-items: center; gap: 12px; }
.topbar .title { font-weight: 700; font-size: 17px; }
.numcard { border-radius: 24px; padding: 20px; color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); display: flex; flex-direction: column; gap: 4px; box-shadow: 0 12px 32px color-mix(in srgb, var(--brand) 35%, transparent); }
.numcard .label { color: rgba(255, 255, 255, .8); }
.number { font-size: 28px; font-weight: 700; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
.numcard .icon-btn { background: rgba(255, 255, 255, .18); color: #fff; }
.dial { align-items: center; }
#dialInput { border: 0; background: transparent; box-shadow: none; text-align: center; font-size: 30px; font-weight: 600; letter-spacing: 1px; padding: 4px 0; font-variant-numeric: tabular-nums; }
#dialInput::placeholder { font-size: 18px; font-weight: 500; letter-spacing: 0; color: var(--sub); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 300px; }
.keypad button { height: 58px; border-radius: 18px; background: var(--surface-2); font-size: 24px; font-weight: 600; display: grid; place-items: center; transition: background .1s, transform .1s; }
.keypad button:active { background: var(--line); transform: scale(.96); }
.keypad .ghost { background: transparent; color: var(--sub); }
.prepList { display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.prepList:empty { display: none; }
.prepList div { padding: 12px 14px; background: var(--surface-2); border-radius: 14px; }

/* 3. 발신/수신 */
#ring { background: radial-gradient(120% 80% at 50% 0%, var(--brand-2), var(--brand) 55%, #312e81); color: #fff; align-items: center; text-align: center; padding-top: 72px; position: relative; }
#ring > * { position: relative; z-index: 1; }
/* 수신 중: 벨소리를 듣지 못해도 알 수 있게 화면 전체를 깜빡인다 */
#ring.alerting::before { content: ""; position: absolute; inset: 0; background: #fff; opacity: 0; animation: flash 1.6s ease-in-out infinite; pointer-events: none; }
@keyframes flash { 0%, 100% { opacity: 0; } 15%, 35% { opacity: .55; } 25% { opacity: .15; } }
@media (prefers-reduced-motion: reduce) { #ring.alerting::before { animation-duration: 3s; } }
#ringLabel { font-size: 15px; opacity: .85; }
.ring-avatar { position: relative; width: 112px; height: 112px; margin: 36px 0 20px; }
.ring-avatar .pulse { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .5); animation: ripple 2s ease-out infinite; }
.ring-avatar .pulse.d2 { animation-delay: 1s; }
@keyframes ripple { from { transform: scale(1); opacity: .8; } to { transform: scale(1.9); opacity: 0; } }
#ringName { font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
#ringInfo { opacity: .8; font-size: 15px; }
.ring-actions { display: flex; justify-content: space-evenly; width: 100%; margin-bottom: 32px; }
.act { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 14px; }

/* 4. 통화 */
#call.on { padding: 0; height: 100dvh; gap: 0; }
.callbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top)); background: var(--surface); border-bottom: 1px solid var(--line); }
.callbar b { display: block; font-size: 16px; }
.callbar .sub { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 5px; vertical-align: 1px; }
#callTimer { font-variant-numeric: tabular-nums; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.seg button { padding: 6px 9px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--sub); }
.seg button:active { background: var(--surface); color: var(--text); }
#log { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 8px; font-size: var(--fs); }
.bubble { max-width: 82%; padding: 10px 15px; border-radius: 20px; white-space: pre-wrap; word-break: break-word; animation: pop .2s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } }
.bubble.peer { align-self: flex-start; background: var(--peer); color: var(--peer-text); border-bottom-left-radius: 6px; box-shadow: var(--shadow); }
.bubble.me { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 6px; }
.bubble.me mark { background: rgba(255, 255, 255, .25); color: #fff; }
.bubble.interim { opacity: .7; border: 1.5px dashed var(--sub); background: transparent; color: var(--text); box-shadow: none; }
.bubble.sys { align-self: center; background: var(--surface-2); color: var(--sub); font-size: 13px; padding: 6px 12px; border-radius: 999px; max-width: 92%; text-align: center; }
.bubble.suspect { outline: 2px solid var(--danger); outline-offset: 2px; }
/* 보이스피싱 경고 */
#scamAlert { display: none; margin: 10px 12px 0; padding: 12px 14px; border-radius: 16px; gap: 10px; align-items: flex-start; border: 1.5px solid; }
#scamAlert.on { display: flex; animation: pop .2s ease; }
#scamAlert.warn { background: #fff7ed; color: #9a3412; border-color: #fdba74; }
#scamAlert.danger { background: #fef2f2; color: #991b1b; border-color: #f87171; animation: pop .2s ease, shake .45s ease .2s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
@media (prefers-color-scheme: dark) {
  #scamAlert.warn { background: #3b2410; color: #fed7aa; border-color: #9a3412; }
  #scamAlert.danger { background: #3f1515; color: #fecaca; border-color: #b91c1c; }
}
#scamAlert .ic { margin-top: 1px; }
#scamAlert b { display: block; font-size: 15px; }
#scamReason { font-size: 14px; }
#scamTip { font-size: 13px; opacity: .85; margin-top: 4px; }
#scamClose { width: 28px; height: 28px; border-radius: 50%; font-size: 14px; opacity: .7; flex-shrink: 0; }
.scam-note { padding: 10px 12px; border-radius: 12px; background: #fef2f2; color: #991b1b; font-size: 14px; }
@media (prefers-color-scheme: dark) { .scam-note { background: #3f1515; color: #fecaca; } }
#typing { padding: 0 18px 8px; color: var(--sub); font-size: 13px; }
#typing:empty { display: none; }
#typing::before { content: "● ● ●"; letter-spacing: 1px; margin-right: 6px; font-size: 8px; vertical-align: 2px; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.dock { background: var(--surface); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px; }
.chips::-webkit-scrollbar { display: none; }
.chips:empty { display: none; }
.chips button { white-space: nowrap; padding: 9px 14px; font-size: 15px; flex-shrink: 0; border-radius: 999px; background: var(--surface-2); transition: transform .1s; }
.chips button:active { transform: scale(.96); }
.chips button.ai { background: var(--brand-soft); color: var(--brand-text); font-weight: 600; }
.chips button.ai::before { content: "✦ "; }
.tabs { display: flex; gap: 4px; }
.tabs button { padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--sub); border-radius: 999px; }
.tabs button.sel { background: var(--text); color: var(--surface); }
.composer { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 999px; padding: 5px; }
.composer input { border: 0; background: transparent; padding: 10px 6px; box-shadow: none; }
.composer input:focus { box-shadow: none; }
.composer .icon-btn { border-radius: 50%; background: transparent; color: var(--sub); }
.composer .icon-btn.live { background: var(--danger); color: #fff; animation: blink 1.4s infinite; }
.send { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: #fff; flex-shrink: 0; transition: transform .1s; }
.send:active { transform: scale(.94); }
.opts { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); cursor: pointer; user-select: none; }
.switch input { display: none; }
.switch i { width: 36px; height: 21px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
.switch input:checked + i { background: var(--brand); }
.switch input:checked + i::after { transform: translateX(15px); }
#refineCard { display: none; background: var(--brand-soft); box-shadow: none; padding: 14px; gap: 8px; border-radius: 18px; }
#refineCard.on { display: flex; }
#refineCard .opt { text-align: left; padding: 11px 14px; border-radius: 14px; background: var(--surface); font-size: 15px; }
#refineCard .opt.primary { background: var(--brand); color: #fff; font-weight: 600; }
.voice { align-items: center; padding-top: 20px; padding-bottom: calc(28px + env(safe-area-inset-bottom)); gap: 14px; }
.mic-orb { position: relative; width: 76px; height: 76px; }
.mic-orb .pulse { position: absolute; inset: 0; border-radius: 50%; background: var(--brand); opacity: .35; animation: ripple 1.8s ease-out infinite; }
.mic-orb .core { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: #fff; }
.mic-orb .ic { width: 30px; height: 30px; }
.voiceHint { text-align: center; color: var(--sub); font-size: 15px; }

/* 5. 종료 */
.end-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; margin: 28px 0 8px; }
.end-ic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--danger); margin-bottom: 8px; }
.end-ic .ic { width: 28px; height: 28px; transform: rotate(135deg); }
.end-head h1 { font-size: 24px; margin: 0; letter-spacing: -.3px; }
#summaryBody { display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.goal { display: inline-block; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-text); font-size: 13px; margin-right: 6px; }
#endLog { max-height: 36vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
#endLog b { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); margin-right: 6px; }

#toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px); background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 16px; font-size: 15px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 40px); z-index: 10; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

<main class="app">

<!-- 1. 설정 -->
<section id="setup" class="screen">
  <div class="hero">
    <div class="logo"><svg class="ic"><use href="#i-caption"/></svg></div>
    <h1>자막 통화</h1>
    <p>각자 편한 방식으로 말하고 듣는 통화예요.</p>
  </div>
  <div class="field">
    <label class="label" for="nameInput">이름</label>
    <input id="nameInput" maxlength="20" placeholder="예: 이주표" autocomplete="name">
  </div>
  <div class="field">
    <span class="label">통화 방식</span>
    <div class="modes">
      <button class="mode" data-mode="caption">
        <span class="mode-ic"><svg class="ic"><use href="#i-caption"/></svg></span>
        <span class="grow"><b>자막 모드</b><span class="sub">상대 말을 자막으로 보고, 글로 답하거나 직접 말해요</span></span>
        <span class="check"></span>
      </button>
      <button class="mode" data-mode="voice">

<audio id="remoteAudio" autoplay playsinline></audio>
<div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

// ---------- 저장소 (실패해도 동작하도록) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

const state = {
  profile: store.get("profile", null),    // {name, mode}
  number: store.get("number", null),
  prep: store.get("prep", null),          // {purpose, greeting, qa:[{question, answer}]}
  ai: false, phone: false,
  peer: null, role: null,
  history: [],                            // [{who:"me"|"peer", text}]
  fontSize: store.get("fontSize", 18),
};

function show(id) {
  if (id !== "ring") stopAlert();
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
}

// ---------- 수신 알림: 진동 + 화면 깜빡임 ----------
// 진동은 안드로이드 크롬 등에서만 동작하고(iOS 미지원), 페이지를 한 번 이상 터치한 뒤에만 허용된다
const RING_VIBRATION = [700, 300, 700, 1300];  // 3초 주기: 징- 징- (쉼)
let alertTimer;
function startAlert() {
  stopAlert();
  $("ring").classList.add("alerting");
  const buzz = () => { try { navigator.vibrate?.(RING_VIBRATION); } catch {} };
  buzz();
  alertTimer = setInterval(buzz, RING_VIBRATION.reduce((a, b) => a + b, 0));
}
function stopAlert() {
  clearInterval(alertTimer); alertTimer = null;
  $("ring").classList.remove("alerting");
  try { navigator.vibrate?.(0); } catch {}
}
let toastTimer;
function toast(msg) {
  $("toast").textContent = msg; $("toast").classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("on"), 2500);
}
const modeName = (m) => ({ voice: "목소리 모드", phone: "일반 전화" }[m] || "자막 모드");
const fmtNum = (n) => n ? `${n.slice(0, 3)}-${n.slice(3, 7)}-${n.slice(7)}` : "";
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initial = (name) => (name || "").trim().charAt(0) || "?";

// ---------- 중요 정보 강조 (규칙 기반) ----------
const HIGHLIGHT = new RegExp([
  "01\\d-?\\d{3,4}-?\\d{4}",                                            // 전화번호
  "\\d[\\d,]*\\s?(?:만\\s?)?원",                                         // 금액
  "\\d{1,2}\\s?월\\s?\\d{1,2}\\s?일",                                    // 날짜
  "(?:오늘|내일|모레|글피|(?:이번|다음)\\s?주(?:\\s?[월화수목금토일]요일)?|[월화수목금토일]요일)",
  "(?:오전|오후|아침|점심|저녁|밤|낮|새벽)?\\s?\\d{1,2}\\s?시(?:\\s?\\d{1,2}\\s?분|\\s?반)?", // 시간
  "(?:\\d+|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열)\\s?(?:명|분|사람|인분|개)", // 인원·수량
].join("|"), "g");
const highlight = (text) => esc(text).replace(HIGHLIGHT, (m) => `<mark>${m}</mark>`);

// ---------- 대화 로그 ----------
const interim = {};  // who -> 점선 말풍선
function addLine(who, text, { record = true } = {}) {
  clearInterim(who);
  const el = document.createElement("div");
  el.className = `bubble ${who}`;
  el.innerHTML = who === "sys" ? esc(text) : highlight(text);
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  if (record && who !== "sys") state.history.push({ who, text });
  return el;
}
function setInterim(who, text) {
  let el = interim[who];
  if (!el) {
    el = interim[who] = document.createElement("div");
    el.className = `bubble ${who} interim`;
    $("log").appendChild(el);
  }
  el.textContent = text;
  $("log").scrollTop = $("log").scrollHeight;
}
function clearInterim(who) { if (interim[who]) { interim[who].remove(); delete interim[who]; } }
function applyFont() { document.documentElement.style.setProperty("--fs", state.fontSize + "px"); store.set("fontSize", state.fontSize); }

// ---------- WebSocket ----------
let ws, wsRetry = 0;
function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => {
    wsRetry = 0;
    send({ type: "register", name: state.profile.name, mode: state.profile.mode, number: state.number });
  };
  ws.onmessage = (e) => onMessage(JSON.parse(e.data));
  ws.onclose = () => {
    $("myNumber").textContent = "다시 연결 중…";
    if (state.peer) endCall("disconnected");
    setTimeout(connect, Math.min(1000 * 2 ** wsRetry++, 10000));
  };
}

function onMessage(m) {
  switch (m.type) {
    case "registered":
      state.number = m.number; store.set("number", m.number);
      $("myNumber").textContent = fmtNum(m.number);
      break;
    case "error":
      toast(m.message); if ($("ring").classList.contains("on")) show("home");
      break;
    case "ringing": showRing("out", m.peer); break;
    case "incoming": showRing("in", m.peer); break;
    case "connected": startCall(m.peer, m.role); break;
    case "ended": endCall(m.reason); break;
    case "caption":   // 상대(목소리 모드)의 음성 인식 자막
      if (m.final) { checkScam(m.text, addLine("peer", m.text)); onPeerFinal(); } else setInterim("peer", m.text);
      break;
    case "message":   // 상대(자막 모드)가 입력한 글
      checkScam(m.text, addLine("peer", m.text)); setTyping(false);
      if (state.profile.mode === "voice") speak(m.text);
      onPeerFinal();
      break;
    case "typing": setTyping(m.on); break;
    case "rtc": onRtc(m.data); break;
  }
}

// ---------- 설정 화면 ----------
let pickedMode = state.profile?.mode || "caption";
function renderModes() { document.querySelectorAll(".mode").forEach((b) => b.classList.toggle("sel", b.dataset.mode === pickedMode)); }
document.querySelectorAll(".mode").forEach((b) => b.onclick = () => { pickedMode = b.dataset.mode; renderModes(); });
$("setupDone").onclick = () => {
  const name = $("nameInput").value.trim();
  if (!name) return toast("이름을 입력해 주세요.");
  state.profile = { name, mode: pickedMode }; store.set("profile", state.profile);
  goHome();
  if (ws && ws.readyState === 1) ws.close(); else if (!ws) connect();
};
$("editProfile").onclick = () => { $("nameInput").value = state.profile.name; pickedMode = state.profile.mode; renderModes(); show("setup"); };

// ---------- 홈 / 통화 준비 도우미 ----------
function goHome() {
  $("homeAvatar").textContent = initial(state.profile.name);
  $("homeName").textContent = state.profile.name;
  $("whoAmI").textContent = modeName(state.profile.mode);
  $("prepCard").classList.toggle("hidden", !state.ai || state.profile.mode !== "caption");
  $("phoneSwitch").classList.toggle("hidden", !state.phone || state.profile.mode !== "caption");
  if ($("phoneSwitch").classList.contains("hidden")) $("phoneToggle").checked = false;
  renderPrep();
  show("home");
}
function renderPrep() {
  const p = state.prep;
  $("purposeInput").value = p?.purpose || $("purposeInput").value;
  $("prepResult").innerHTML = !p?.qa ? "" :
    `<div><b>첫인사</b><br>${esc(p.greeting)}</div>` +
    p.qa.map((x) => `<div><span class="sub">Q. ${esc(x.question)}</span><br>${esc(x.answer)}</div>`).join("");
}
$("prepBtn").onclick = async () => {
  const purpose = $("purposeInput").value.trim();
  if (!purpose) return toast("통화 목적을 입력해 주세요.");
  $("prepBtn").disabled = true; $("prepBtn").textContent = "만드는 중…";
  try {
    const r = await api("/api/prep", { purpose });
    state.prep = { purpose, ...r }; store.set("prep", state.prep); renderPrep();
  } catch (e) { toast(e.message); }
  $("prepBtn").disabled = false; $("prepBtn").textContent = "답변 미리 만들기";
};
$("prepClear").onclick = () => { state.prep = null; store.del("prep"); $("purposeInput").value = ""; renderPrep(); };

$("copyNumber").onclick = async () => {
  if (!state.number) return;
  try { await navigator.clipboard.writeText(fmtNum(state.number)); toast("내 번호를 복사했어요."); } catch { toast("복사하지 못했어요."); }
};

// 번호 입력: 키패드와 직접 입력 모두 010-0000-0000 형태로 맞춘다
function setDial(digits) {
  const d = digits.replace(/\D/g, "").slice(0, 11);
  $("dialInput").value = d.length > 7 ? `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}` : d.length > 3 ? `${d.slice(0, 3)}-${d.slice(3)}` : d;
}
$("dialInput").oninput = () => setDial($("dialInput").value);
$("keypad").querySelectorAll("button").forEach((b) => b.onclick = () => {
  const d = $("dialInput").value.replace(/\D/g, "");
  setDial(b.dataset.key === "back" ? d.slice(0, -1) : d + b.textContent);
});

$("callBtn").onclick = () => {
  const to = $("dialInput").value.replace(/\D/g, "");
  unlockAudio();
  // 일반 전화: 서버가 Twilio로 실제 전화를 건다 (02 등 지역번호도 허용)
  if ($("phoneToggle").checked) {
    if (!/^0\d{8,10}$/.test(to)) return toast("전화번호를 확인해 주세요.");
    return send({ type: "phone_call", to });
  }
  if (to.length !== 11) return toast("번호 11자리를 입력해 주세요.");
  send({ type: "call", to });
};

// ---------- 발신/수신 ----------
function showRing(dir, peer) {
  $("ringLabel").textContent = dir === "in" ? "전화가 왔어요" : "전화를 거는 중…";
  $("ringAvatar").textContent = initial(peer.name);
  $("ringName").textContent = peer.name;
  $("ringInfo").textContent = `${fmtNum(peer.number)} · ${modeName(peer.mode)}`;
  $("acceptBtn").parentElement.classList.toggle("hidden", dir !== "in");
  $("rejectBtn").parentElement.classList.toggle("hidden", dir !== "in");
  $("cancelBtn").parentElement.classList.toggle("hidden", dir === "in");
  show("ring");
  if (dir === "in") startAlert();
}
$("acceptBtn").onclick = () => { unlockAudio(); send({ type: "accept" }); };
$("rejectBtn").onclick = () => { send({ type: "reject" }); show("home"); };
$("cancelBtn").onclick = () => { send({ type: "hangup" }); show("home"); };

// ---------- 통화 ----------
let callStart = 0, callClock;
function tickClock() {
  const s = Math.floor((Date.now() - callStart) / 1000);
  $("callTimer").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
}

function startCall(peer, role) {
  state.peer = peer; state.role = role; state.history = [];
  $("log").innerHTML = ""; $("aiChips").innerHTML = ""; hideRefine(); setTyping(false); resetScam();
  $("callAvatar").textContent = initial(peer.name);
  $("callName").textContent = peer.name;
  $("callInfo").textContent = modeName(peer.mode);
  $("voiceHint").textContent = VOICE_HINT;
  $("muteBtn").classList.add("hidden"); setMuted(false);
  callStart = Date.now(); tickClock(); clearInterval(callClock); callClock = setInterval(tickClock, 1000);
  const caption = state.profile.mode === "caption";
  $("captionDock").classList.toggle("hidden", !caption);
  $("voiceDock").classList.toggle("hidden", caption);
  renderQuick(state.prep?.qa ? "준비" : "기본");
  show("call");

  // 일반 전화 상대에게는 음성 연결(직접 말하기)을 할 수 없다
  $("talkBtn").classList.toggle("hidden", peer.mode === "phone");
  if (caption) {
    addLine("sys", peer.mode === "phone" ? "일반 전화로 연결됐어요. 상대 말은 자막으로, 보낸 글은 음성으로 전달돼요." : "상대의 말이 자막으로 표시돼요.", { record: false });
    if (state.prep?.greeting) $("msgInput").value = state.prep.greeting;
  } else if (voiceCall()) {
    // 둘 다 목소리 모드면 자막 없이 양방향 일반 음성 통화로 연결 (거는 쪽이 연결을 시작)
    addLine("sys", "둘 다 목소리 모드라 일반 음성 통화로 연결해요.", { record: false });
    $("voiceHint").textContent = "일반 음성 통화 중이에요.";
    $("muteBtn").classList.remove("hidden");
    if (role === "caller") startTalk();
  } else {
    addLine("sys", "상대가 입력한 글을 음성으로 읽어 드려요.", { record: false });
    if (peer.mode === "caption") speak("상대방은 자막으로 통화하고 있어요. 천천히 또박또박 말씀해 주세요.");
    startStt();
  }
}

function endCall(reason) {
  if (!state.peer && !$("ring").classList.contains("on")) return;
  const wasInCall = !!state.peer;
  state.peer = null;
  clearInterval(callClock);
  stopStt(); stopTalk(); speechSynthesis.cancel(); setTyping(false);
  if (!wasInCall) {
    toast(reason === "rejected" ? "상대가 전화를 받지 않았어요." : "통화가 연결되지 않았어요.");
    return goHome();
  }
  const reasons = { hangup: "통화를 끝냈어요.", disconnected: "연결이 끊겼어요.", rejected: "" };
  $("endReason").textContent = reasons[reason] ?? "";
  $("endDuration").textContent = `· 통화 시간 ${$("callTimer").textContent}`;
  $("endLog").innerHTML = state.history.map((l) =>
    `<div><b>${l.who === "me" ? "나" : "상대"}</b>${highlight(l.text)}</div>`).join("") || '<span class="sub">대화 기록이 없어요.</span>';
  if (scam.rank > 0) {
    $("endLog").insertAdjacentHTML("afterbegin",
      `<div class="scam-note">⚠️ 통화 중 ${scam.rank === 2 ? "보이스피싱 의심" : "주의"} 경고가 있었어요. ${esc(scam.reason || "")}</div>`);
  }
  show("ended");
  summarize();
}
$("hangupBtn").onclick = () => { send({ type: "hangup" }); endCall("hangup"); };
$("homeBtn").onclick = goHome;
$("copyBtn").onclick = async () => {
  const text = state.history.map((l) => `${l.who === "me" ? "나" : "상대"}: ${l.text}`).join("\n");
  try { await navigator.clipboard.writeText(text); toast("복사했어요."); } catch { toast("복사하지 못했어요."); }
};
$("fontUp").onclick = () => { state.fontSize = Math.min(32, state.fontSize + 2); applyFont(); };
$("fontDown").onclick = () => { state.fontSize = Math.max(14, state.fontSize - 2); applyFont(); };

async function summarize() {
  if (!state.ai || state.history.length === 0) { $("summaryCard").classList.add("hidden"); return; }
  $("summaryCard").classList.remove("hidden");
  $("summaryBody").textContent = "요약하는 중…";
  try {
    const r = await api("/api/summary", { history: state.history, purpose: state.prep?.purpose || "" });
    $("summaryBody").innerHTML =
      r.summary.map((s) => `<div>• ${highlight(s)}</div>`).join("") +
      (state.prep?.purpose ? `<div style="margin-top:8px"><span class="goal">${esc(r.goal)}</span>${esc(r.goal_reason)}</div>` : "");
  } catch (e) { $("summaryBody").textContent = e.message; }
}

// ---------- 자막 모드: 보내기, 다듬기, 빠른 문장, 입력 중 표시 ----------
const QUICK = {
  "기본": ["안녕하세요. 저는 청각장애가 있어 자막으로 통화하고 있어요.", "천천히 말씀해 주세요.", "다시 한 번 말씀해 주시겠어요?", "네, 맞아요.", "아니요.", "잠시만 기다려 주세요."],
  "약속": ["예약하고 싶어요.", "예약을 바꾸고 싶어요.", "가능한 시간이 언제인가요?", "그 시간 괜찮아요.", "다른 시간은 없을까요?", "주소를 문자로 보내 주실 수 있나요?"],
  "마무리": ["감사합니다.", "알겠습니다. 그렇게 할게요.", "확인했어요. 좋은 하루 보내세요.", "나중에 다시 연락드릴게요."],
};
let quickTab = "기본";
function renderQuick(tab) {
  const tabs = Object.keys(QUICK).concat(state.prep?.qa ? ["준비"] : []);
  quickTab = tabs.includes(tab) ? tab : "기본";
  $("quickTabs").innerHTML = "";
  tabs.forEach((t) => {
    const b = document.createElement("button");
    b.textContent = t; b.className = t === quickTab ? "sel" : "";
    b.onclick = () => renderQuick(t);
    $("quickTabs").appendChild(b);
  });
  const items = quickTab === "준비"
    ? [state.prep.greeting, ...state.prep.qa.map((x) => x.answer)]
    : QUICK[quickTab];
  fillChips($("quickChips"), items, "");
}
function fillChips(box, items, cls) {
  box.innerHTML = "";
  items.forEach((text) => {
    const b = document.createElement("button");
    b.textContent = text; b.className = cls;
    // 빈칸([이름] 등)이 남은 문장은 입력창으로 옮겨 채운 뒤 보내게 한다
    b.onclick = () => /\[[^\]]*\]/.test(text) ? (($("msgInput").value = text), $("msgInput").focus()) : sendText(text);
    box.appendChild(b);
  });
}

function sendText(text) {
  text = text.trim();
  if (!text || !state.peer) return;
  send({ type: "message", text });
  addLine("me", text);
  $("aiChips").innerHTML = "";
  stopTyping();
}

async function submitInput() {
  const text = $("msgInput").value.trim();
  if (!text) return;
  if (!state.ai || !$("refineToggle").checked) { $("msgInput").value = ""; return sendText(text); }
  $("sendBtn").disabled = true;
  try {
    const { refined } = await api("/api/refine", { text, history: state.history });
    if (!refined || refined === text) { $("msgInput").value = ""; sendText(text); }
    else showRefine(text, refined);
  } catch { $("msgInput").value = ""; sendText(text); }
  $("sendBtn").disabled = false;
}
function showRefine(original, refined) {
  $("refinedOpt").textContent = `이대로 보내기: ${refined}`;
  $("originalOpt").textContent = `원래대로 보내기: ${original}`;
  $("refinedOpt").onclick = () => { hideRefine(); $("msgInput").value = ""; sendText(refined); };
  $("originalOpt").onclick = () => { hideRefine(); $("msgInput").value = ""; sendText(original); };
  $("refineCard").classList.add("on");
}
function hideRefine() { $("refineCard").classList.remove("on"); }
$("sendBtn").onclick = submitInput;
$("msgInput").onkeydown = (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); submitInput(); } };

let typingOn = false, typingIdle;
$("msgInput").oninput = () => {
  hideRefine();
  if (!$("msgInput").value) return stopTyping();
  if (!typingOn) { typingOn = true; send({ type: "typing", on: true }); }
  clearTimeout(typingIdle); typingIdle = setTimeout(stopTyping, 5000);
};
function stopTyping() {
  clearTimeout(typingIdle);
  if (typingOn) { typingOn = false; send({ type: "typing", on: false }); }
}

// 상대가 입력 중일 때: 표시하고, 목소리 모드면 4초 뒤 대기 안내를 들려준다
let peerTypingTimer;
function setTyping(on) {
  $("typing").textContent = on ? `${state.peer?.name || "상대"}님이 입력하고 있어요` : "";
  clearTimeout(peerTypingTimer);
  if (on && state.profile?.mode === "voice") {
    peerTypingTimer = setTimeout(() => speak("잠시만요, 입력하고 있어요."), 4000);
  }
}

// ---------- 보이스피싱 경고: 의심 표현은 규칙으로 바로 표시하고, AI가 대화 전체를 보고 확인 ----------
const SCAM_WORDS = new RegExp([
  "계좌", "통장", "이체", "송금", "입금", "현금", "인출", "안전\\s?계좌", "공탁",
  "인증\\s?번호", "OTP", "보안\\s?카드", "비밀\\s?번호", "카드\\s?번호", "주민\\s?(?:등록)?\\s?번호",
  "검찰", "검사", "수사관", "경찰청", "금감원", "금융\\s?감독원", "사이버\\s?수사",
  "범죄", "연루", "명의\\s?도용", "대포\\s?통장", "저금리", "대환\\s?대출",
  "앱", "어플", "설치", "원격", "링크", "상품권", "기프트\\s?카드",
].join("|"), "i");
const SCAM_LEVEL = { "안전": 0, "주의": 1, "위험": 2 };
let scam = { rank: 0, reason: "", byRule: false, dismissed: 0 }, scamTimer, scamSeq = 0;

function resetScam() { clearTimeout(scamTimer); scamSeq++; scam = { rank: 0, reason: "", byRule: false, dismissed: 0 }; renderScam(); }
function setScam(rank, reason, byRule) {
  const prev = scam.rank;
  scam = { ...scam, rank, reason, byRule };
  if (rank === 0) document.querySelectorAll("#log .suspect").forEach((e) => e.classList.remove("suspect"));
  // 위험으로 올라가면 화면을 보고 있지 않아도 알 수 있게 강하게 진동
  if (rank === 2 && prev < 2) { try { navigator.vibrate?.([300, 100, 300, 100, 300]); } catch {} }
  renderScam();
}
function renderScam() {
  const visible = scam.rank > scam.dismissed;
  $("scamAlert").className = visible ? `on ${scam.rank === 2 ? "danger" : "warn"}` : "";
  if (!visible) return;
  $("scamTitle").textContent = scam.rank === 2 ? "보이스피싱이 의심돼요" : "주의가 필요한 대화예요";
  $("scamReason").textContent = scam.reason;
  $("scamTip").textContent = scam.rank === 2
    ? "계좌·인증번호·비밀번호를 절대 알려주지 말고, 전화를 끊은 뒤 기관 대표번호로 직접 확인하세요."
    : "돈이나 개인정보를 요구하면 바로 알려주지 마세요.";
}
$("scamClose").onclick = () => { scam.dismissed = scam.rank; renderScam(); };

function checkScam(text, el) {
  const hit = text.match(SCAM_WORDS);
  if (hit) {
    el.classList.add("suspect");
    if (scam.rank === 0) setScam(1, `'${hit[0]}' 같은 말이 나왔어요.${state.ai ? " AI가 확인하고 있어요…" : ""}`, true);
  }
  if (!state.ai) return;
  clearTimeout(scamTimer);
  scamTimer = setTimeout(async () => {
    const seq = ++scamSeq;
    try {
      const r = await api("/api/scam", { history: state.history });
      if (seq !== scamSeq || !state.peer) return;
      const rank = SCAM_LEVEL[r.level] ?? 0;
      // AI 판정은 경고를 낮추지 않되(같은 단계면 이유만 갱신), 규칙으로만 띄운 경고는 AI가 낮추거나 지울 수 있다
      if (rank >= scam.rank || scam.byRule) setScam(rank, r.reason, false);
    } catch {}
  }, 600);
}

// AI 답변 추천: 상대 말이 끝날 때마다
let suggestTimer, suggestSeq = 0;
function onPeerFinal() {
  if (!state.ai || state.profile.mode !== "caption") return;
  clearTimeout(suggestTimer);
  suggestTimer = setTimeout(async () => {
    const seq = ++suggestSeq;
    try {
      const { suggestions } = await api("/api/suggest", { history: state.history, purpose: state.prep?.purpose || "" });
      if (seq === suggestSeq && state.peer) fillChips($("aiChips"), suggestions, "ai");
    } catch {}
  }, 500);
}

// ---------- 음성 인식(STT): 목소리 모드 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, sttWanted = false, sttPaused = false;
function startStt() {
  if (!SR) { addLine("sys", "이 브라우저는 음성 인식을 지원하지 않아요. 크롬을 사용해 주세요.", { record: false }); return; }
  sttWanted = true;
  if (rec) return;
  rec = new SR();
  rec.lang = "ko-KR"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const text = e.results[i][0].transcript.trim();
      if (!text) continue;
      const final = e.results[i].isFinal;
      send({ type: "caption", text, final });
      if (final) addLine("me", text); else setInterim("me", text);
    }
  };
  rec.onerror = (e) => {
    if (e.error === "not-allowed") { sttWanted = false; addLine("sys", "마이크 권한이 필요해요.", { record: false }); }
  };
  // 크롬은 잠시 조용하면 인식을 멈추므로 통화 중에는 다시 시작한다
  rec.onend = () => { rec = null; if (sttWanted && !sttPaused) startStt(); };
  try { rec.start(); } catch {}
}
function stopStt() { sttWanted = false; if (rec) { try { rec.abort(); } catch {} rec = null; } }

// ---------- 음성 합성(TTS) ----------
function koVoice() { return speechSynthesis.getVoices().find((v) => v.lang?.startsWith("ko")); }
function speak(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ko-KR"; const v = koVoice(); if (v) u.voice = v;
  // 읽는 동안 음성 인식을 멈춰 자기 소리가 자막에 섞이지 않게 한다
  u.onstart = () => { if (sttWanted) { sttPaused = true; if (rec) { try { rec.abort(); } catch {} } } };
  u.onend = u.onerror = () => {
    if (sttPaused && !speechSynthesis.pending) { sttPaused = false; if (sttWanted) startStt(); }
  };
  speechSynthesis.speak(u);
}
// 모바일 자동 재생 제한: 버튼을 누를 때 무음으로 한 번 재생해 둔다
function unlockAudio() {
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch {}
  $("remoteAudio").play().catch(() => {});
}

// ---------- 음성 연결(WebRTC): 자막 모드의 직접 말하기(한 방향), 목소리↔목소리 일반 통화(양방향) ----------
let pc = null, localStream = null, pendingIce = [];
const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
const VOICE_HINT = "평소처럼 말씀하세요. 말이 자막으로 전달돼요.";
const voiceCall = () => state.profile.mode === "voice" && state.peer?.mode === "voice";
function newPc() {
  const p = new RTCPeerConnection(ICE);
  pendingIce = [];
  p.onicecandidate = (e) => { if (e.candidate) send({ type: "rtc", data: { candidate: e.candidate } }); };
  p.ontrack = (e) => { $("remoteAudio").srcObject = e.streams[0]; $("remoteAudio").play().catch(() => {}); };
  return p;
}
async function openMic() {
  localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
}
async function startTalk() {
  pc = newPc();
  try { await openMic(); } catch { pc.close(); pc = null; return toast("마이크를 사용할 수 없어요."); }
  await pc.setLocalDescription(await pc.createOffer());
  send({ type: "rtc", data: { sdp: pc.localDescription } });
  if (voiceCall()) return;
  $("talkBtn").classList.add("live"); $("talkBtn").title = "말하는 중 (누르면 꺼짐)";
  toast("상대에게 내 목소리가 전달돼요.");
}
function setMuted(muted) {
  localStream?.getAudioTracks().forEach((t) => { t.enabled = !muted; });
  $("muteBtn").textContent = muted ? "마이크 켜기" : "음소거";
  $("muteBtn").classList.toggle("primary", muted);
}
$("muteBtn").onclick = () => setMuted($("muteBtn").textContent === "음소거");
function stopTalk(notify = true) {
  if (pc) { pc.close(); pc = null; if (notify && state.peer) send({ type: "rtc", data: { bye: true } }); }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  $("talkBtn").classList.remove("live"); $("talkBtn").title = "직접 말하기";
}
async function onRtc(d) {
  if (d.bye) return stopTalk(false);
  if (d.sdp?.type === "offer") {
    if (pc) pc.close();
    pc = newPc();
    await pc.setRemoteDescription(d.sdp);
    flushIce();
    // 일반 통화면 받는 쪽도 마이크를 붙여 양방향으로 만든다
    if (voiceCall()) { try { await openMic(); } catch { toast("마이크를 사용할 수 없어요."); } }
    await pc.setLocalDescription(await pc.createAnswer());
    send({ type: "rtc", data: { sdp: pc.localDescription } });
  } else if (d.sdp?.type === "answer" && pc) {
    await pc.setRemoteDescription(d.sdp);
    flushIce();
  } else if (d.candidate) {
    // 상대 연결 정보가 먼저 도착하면 모아 뒀다가 연결 설정 후 추가
    if (pc?.remoteDescription) { try { await pc.addIceCandidate(d.candidate); } catch {} }
    else pendingIce.push(d.candidate);
  }
}
function flushIce() {
  const list = pendingIce; pendingIce = [];
  list.forEach((c) => pc.addIceCandidate(c).catch(() => {}));
}
$("talkBtn").onclick = () => (localStream ? stopTalk() : startTalk());

// ---------- AI API ----------
async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) {
    let msg = "AI 요청에 실패했어요.";
    try { msg = (await r.json()).detail || msg; } catch {}
    throw new Error(msg);
  }
  return r.json();
}

// ---------- 시작 ----------
applyFont();
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};
fetch("/api/config").then((r) => r.json()).then((c) => { state.ai = c.ai; state.phone = c.phone; if (state.profile && $("home").classList.contains("on")) goHome(); }).catch(() => {});
renderModes();
if (state.profile) { goHome(); connect(); } else show("setup");
</script>
