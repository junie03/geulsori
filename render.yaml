# Render 배포 설정 (Blueprint)
# Render 대시보드 → New → Blueprint 에서 이 저장소를 고르면 아래 설정으로 웹 서비스가 만들어진다.
# main 브랜치에 push하면 자동으로 다시 배포된다. 주소: https://geulsori.onrender.com
services:
  - type: web
    name: geulsori
    runtime: python
    plan: free            # 무료: 15분간 접속이 없으면 잠들고, 첫 접속 때 약 1분 걸려 깨어남
    region: singapore     # 한국과 가장 가까운 지역
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      # 키 값은 저장소에 넣지 않고 Render 대시보드 → Environment 에서 직접 입력한다
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
